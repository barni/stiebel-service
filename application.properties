## Template, copy it next to the jar and fill in the values

## Mail on a USB restart, a new fault and a warning to stbl.mail.to, nothing is sent while it or spring.mail.host is empty. Example for Gmail:
stbl.mail.to=
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=<email>@gmail.com
#spring.mail.password=<app password>
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true

## Login for the REST API, the status page and the configuration page (HTTP basic auth)
spring.security.user.name=<user>
spring.security.user.password=<password>

## Listen only on localhost, use reverse proxy for https
#server.address=127.0.0.1

## USBtin CAN adapter, the heat pump bus runs with 20 kbit/s
USBtin.port=/dev/ttyACM0
USBtin.speed=20000

## true: receive all CAN messages (log them with DEBUG), false: only the answers to this service
can.logall=true
logging.file.name=logfile.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=3

## InfluxDB 2, the token is read from the environment variable INFLUX_TOKEN
## influx.enabled=false runs the service without InfluxDB: nothing is stored and the status page shows no courses
## of the values, no daily overview, no comparison of the setting Waermebedarf and no failed starts per season
#influx.enabled=false
influx.url=http://localhost:8086
influx.token=${INFLUX_TOKEN:}
influx.org=<org>
influx.bucket=<bucket>

## Comparison of the setting Waermebedarf, first day and outdoor temperature. Without entity the heat pump's own
## WP_Aussentemp is used (stored since 09/2026); with a Home Assistant entity the token needs read access to its bucket
#auswertung.start=2023-07-01
#auswertung.aussentemp.bucket=home_assistant
#auswertung.aussentemp.entity=aussen_temperatur
## First day of the failed starts per heating season
#auswertung.fehlstarts.start=2019-01-01

## Warnings by mail: heating pressure in bar, answer rate in %, compressor starts per hour
#warnung.heizungsdruck.min=1.3
#warnung.heizungsdruck.max=2.5
#warnung.antwortquote.min=90
#warnung.starts.proStunde=3
## Too little water flow: high pressure of the refrigerant circuit in bar, spread flow/return in K
#warnung.hochdruck.max=38
#warnung.spreizung.max=10

## The page /konfiguration changes this file: warnings, evaluations, InfluxDB, mail and the CAN adapter; not the login,
## server.address, the log file and influx.token.
## Another file than application.properties in the working directory:
#stbl.config.datei=/var/stbl-service/application.properties
